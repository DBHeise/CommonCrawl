name: Test-Build-Release

on:
  push:
    branches: [ "main" ]


jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go (from go.mod)
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'  # Reads Go version from go.mod
        cache: true                # Optional: cache Go modules
    - name: Test
      shell: pwsh
      run: .\scripts\test.ps1

  version:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    outputs:
      newtag: ${{ steps.calculate-version.outputs.version-string }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: calculate version
        id: calculate-version
        uses: bitshifted/git-auto-semver@v2
        with:
          main_branch: main
          create_tag: true
          tag_prefix: 'v'
      - name: Use version
        run: 'echo "Calculated version: ${{ steps.calculate-version.outputs.version-string }}"'

  build:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        target:
          - GOOS: linux
            GOARCH: amd64
          - GOOS: linux
            GOARCH: arm64
          - GOOS: darwin
            GOARCH: amd64
          - GOOS: windows
            GOARCH: amd64
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go (from go.mod)
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'  # Reads Go version from go.mod
        cache: true                # Optional: cache Go modules
    - name: Build for ${{ matrix.target.GOOS }}/${{ matrix.target.GOARCH }}
      shell: pwsh
      run: |
        $env:GOOS="${{ matrix.target.GOOS }}"
        $env:GOARCH="${{ matrix.target.GOARCH }}"
        $env:VER="${{ needs.version.outputs.newtag }}"
        ./scripts/compile.ps1
    - name: Archive
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: CommonCrawl-${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}
        path: Bin/CommonCrawl-${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}*

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
      - version
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare Artifacts for Release
        run: |
          for file in artifacts/*; do
            [ -f "$file" ] || continue
            7z a "${file}.zip" "$file"
          done
      - name: Create a Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.version.outputs.newtag }}
          tag_name: ${{ needs.version.outputs.newtag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
          files:
            artifacts/*.zip
